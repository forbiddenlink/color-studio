# Wait one week (in minutes) before resolving newly published packages, so a
# compromised release (e.g. the Shai-Hulud npm worm) is pulled before it reaches
# installs in CI or Vercel.
minimumReleaseAge: 10080
overrides:
  "body-parser": ">=2.4.0 <3"
  "launch-editor": ">=2.14.2 <3"
  "webpack-dev-server": ">=5.2.1 <7"
  "on-headers": ">=1.1.0 <2"
  "qs": ">=6.16.0 <7"
  "webpack": ">=5.104.1 <6"
  "ajv": ">=8.18.0 <9"
  "minimatch": ">=3.1.4 <4"
  "serialize-javascript": ">=7.0.5 <8"
  "vite": ">=8.0.5 <9"
  "protobufjs": "^7.6.1"
  "dompurify": ">=3.4.13 <4"
  "follow-redirects": ">=1.16.0 <2"
  "@babel/plugin-transform-modules-systemjs": ">=7.27.0 <9"
  "uuid": ">=11.1.1 <12"
  "postcss": ">=8.5.23 <9"
  "uuid@11": ">=11.1.1 <12"
  "fast-uri": ">=2.4.8 <3"
  "postcss-selector-parser": ">=7.1.3 <8"
  "webpack-dev-middleware": ">=8.3.0 <9"
  "shell-quote": ">=1.11.0 <2"
  "proxy-addr": ">=2.0.8 <3"
  "source-map-js@1": ">=1.2.2 <2.0.0"
  "compression@1": ">=1.8.2 <2.0.0"

# picomatch ReDoS, no patched release as of 2026-11-18; dev tooling only. Remove once picomatch > 4.0.7 ships.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
